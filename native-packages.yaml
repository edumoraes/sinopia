# Shared CLI: gem install native-packages --version 0.7.0
#
# The release's own archives are what gets distributed: the binary one for
# sinopia-bin, the source one for sinopia. This file only fills the AUR
# recipes in with their checksums and publishes them — no native package
# is built here, hence no targets. See PACKAGING.md.
---
schema: 1
tool:
  version: '0.7.0'
  nfpm: '2.47.0'
nfpm:
  name: sinopia
  maintainer: Eduardo de Moraes <edumoraesdg@gmail.com>
  homepage: https://github.com/edumoraes/omawhite
  description: Local-first whiteboard for Omarchy with export for the agent
  license: MIT
targets: {}
release:
  repository: edumoraes/omawhite
  checksums: checksums.txt
assets:
  AMD64:
    file: sinopia-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/sinopia-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: sinopia-v@VERSION@-source.tar.gz
    local: dist/sinopia-v@VERSION@-source.tar.gz
templates:
  arch/sinopia/PKGBUILD: packaging/arch/sinopia/PKGBUILD.in
  arch/sinopia/sinopia.install: packaging/arch/sinopia.install
  arch/sinopia-bin/PKGBUILD: packaging/arch/sinopia-bin/PKGBUILD.in
  arch/sinopia-bin/sinopia-bin.install: packaging/arch/sinopia.install
  arch/sinopia-git/PKGBUILD: packaging/arch/sinopia-git/PKGBUILD.in
  arch/sinopia-git/sinopia-git.install: packaging/arch/sinopia.install
repositories:
  aur-source:
    group: aur
    url: https://aur.archlinux.org/sinopia.git
    push_url: ssh://aur@aur.archlinux.org/sinopia.git
    branch: master
    package_path: "."
    files:
      arch/sinopia: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/sinopia-bin.git
    push_url: ssh://aur@aur.archlinux.org/sinopia-bin.git
    branch: master
    package_path: "."
    files:
      arch/sinopia-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/sinopia-git.git
    push_url: ssh://aur@aur.archlinux.org/sinopia-git.git
    branch: master
    package_path: "."
    files:
      arch/sinopia-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
