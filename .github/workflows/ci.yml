name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the run before it moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning is an error here, as it is on the desk: a build that grows
  # one is a build nobody can read the next one from.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The window, the GPU and the Wayland protocols are all loaded at
      # run time (`dlopen`), and the suite never opens a window, so the
      # runner needs nothing past the toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      # The archive a release carries, packed around this build and
      # installed from inside: a file the packages need that nobody ships
      # fails on the push rather than on the tag.
      - run: sh packaging/archive.sh v0.0.0 target/debug/sinopia "$RUNNER_TEMP/dist"

  # The plugin's reading of index.json, in plain QML: no shell needed,
  # only Qt's own test runner, offscreen.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick \
            qml6-module-qtqml-workerscript
      - run: /usr/lib/qt6/bin/qmltestrunner -input tests/plugin
        env:
          QT_QPA_PLATFORM: offscreen
