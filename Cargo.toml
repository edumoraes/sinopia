[package]
name = "omawhite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
fontdue = { version = "0.9.4", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2.189"
log = "0.4.34"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11", default-features = false }
ulid = "3.0.0"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wgpu = "30.0.1"
winit = "0.30.13"

[dev-dependencies]
# The same naga wgpu compiles the shader with: the suite parses and
# validates the WGSL, which otherwise fails only at the first window.
naga = { version = "30.0.1", features = ["wgsl-in"] }
tempfile = "3.27.0"
